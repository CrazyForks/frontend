name: Build and Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main      # push 到 main 自动打测试包（全平台 dev 构建 + main 的 prerelease）
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      build_web:
        description: '构建 Web (standalone + embedded)'
        type: boolean
        default: true
      build_linux:
        description: '构建 Linux (x64)'
        type: boolean
        default: true
      build_windows:
        description: '构建 Windows (x64)'
        type: boolean
        default: true
      build_macos:
        description: '构建 macOS (Universal)'
        type: boolean
        default: true
      build_android:
        description: '构建 Android (APK)'
        type: boolean
        default: true
      build_ios:
        description: '构建 iOS (No Codesign)'
        type: boolean
        default: true

# 同一 ref 只保留最新一次运行
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  # 原生 bundle(桌面/移动)统一 stable 3.44.6(下方各 bundle job 复用此变量)。
  # web(build-web job)单独用 beta 3.47:含引擎修复 #185116
  # (flutter/flutter#184683,切后台 WebGL context 丢失致 LateInitializationError
  # 崩溃/白屏),该修复尚未进 stable;与父仓库 songloft/release.yml 的 build-frontend
  # 保持一致。待进 stable 后回退与 bundle 统一。
  FLUTTER_VERSION: '3.44.6'

permissions:
  contents: write

jobs:
  # ============================================================
  # 构建矩阵
  # ============================================================
  build-web:
    name: Web (${{ matrix.mode }})
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_web }}
    strategy:
      matrix:
        mode: [standalone, embedded]
    steps:
      - uses: actions/checkout@v4
      # web 走 beta 3.47(含引擎修复 #185116),不复用 FLUTTER_VERSION(那是 bundle 用的 stable)
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0-0.1.pre
          channel: beta
          cache: true
      - run: flutter pub get
      - name: Extract version from pubspec.yaml
        id: version
        run: |
          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="$PUBSPEC_VERSION"
          else
            VERSION="dev"
          fi
          BUILD_TIME=$(date -u '+%Y-%m-%d_%H:%M:%S')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_time=$BUILD_TIME" >> "$GITHUB_OUTPUT"
      - run: flutter build web --release --no-web-resources-cdn --dart-define=DEPLOY_MODE=${{ matrix.mode }} --dart-define=FRONTEND_VERSION=${{ steps.version.outputs.version }} --dart-define=FRONTEND_BUILD_TIME=${{ steps.version.outputs.build_time }} --dart-define=TRACELY_APP_ID=${{ secrets.TRACELY_APP_ID }} --dart-define=TRACELY_APP_SECRET=${{ secrets.TRACELY_APP_SECRET }} --dart-define=TRACELY_HOST=${{ secrets.TRACELY_HOST }}
      - name: Package
        run: |
          cd build/web
          tar czf "$GITHUB_WORKSPACE/songloft-web-${{ matrix.mode }}.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: songloft-web-${{ matrix.mode }}
          path: songloft-web-${{ matrix.mode }}.tar.gz

  build-linux:
    name: Linux (x64)
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_linux }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libglu1-mesa libstdc++-12-dev libsecret-1-dev libayatana-appindicator3-dev
          # 用于 DEB/RPM/AppImage 构建
          sudo apt-get install -y rpm patchelf
      - name: Install appimagetool
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O /tmp/appimagetool
          chmod +x /tmp/appimagetool
          sudo mv /tmp/appimagetool /usr/local/bin/appimagetool
          # GitHub Actions 容器不支持 FUSE，设置此环境变量让 AppImage 工具以 extract 模式运行
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> $GITHUB_ENV
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install fastforge
        run: dart pub global activate fastforge
      - name: Add pub cache to PATH
        run: echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH
      - run: flutter pub get
      - name: Extract version from pubspec.yaml
        id: version
        run: |
          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="$PUBSPEC_VERSION"
          else
            VERSION="dev"
          fi
          BUILD_TIME=$(date -u '+%Y-%m-%d_%H:%M:%S')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_time=$BUILD_TIME" >> "$GITHUB_OUTPUT"
      - run: flutter build linux --release --dart-define=FRONTEND_VERSION=${{ steps.version.outputs.version }} --dart-define=FRONTEND_BUILD_TIME=${{ steps.version.outputs.build_time }} --dart-define=TRACELY_APP_ID=${{ secrets.TRACELY_APP_ID }} --dart-define=TRACELY_APP_SECRET=${{ secrets.TRACELY_APP_SECRET }} --dart-define=TRACELY_HOST=${{ secrets.TRACELY_HOST }}
      - name: Prepare app icon for fastforge
        run: |
          mkdir -p assets/icons
          cp web/icons/Icon-512.png assets/icons/app_icon.png
      # GPLv3 §4 合规（songloft-org/songloft#341）：许可全文已经通过 pubspec 的
      # `assets:` 进了 data/flutter_assets/LICENSES/（App 内「设置 → 开源许可」读它，
      # 离线可读）。这里再往 bundle 根放一份，让用户解包后**不用翻 flutter_assets**
      # 就能看到。tar.gz / deb / rpm / AppImage 都从这个目录打包，一次覆盖四种产物。
      #
      # 刻意放在打包**之前**：这几种产物均无代码签名，且即便将来加了签名，签名也发生
      # 在打包之后、对最终内容计算，所以不存在「往已签名容器里塞文件」的风险。
      - name: Bundle GPL-3.0 license text into Linux payload
        run: cp LICENSES/GPL-3.0.txt build/linux/x64/release/bundle/LICENSE-GPL-3.0.txt
      - name: Package tar.gz (基础便携包)
        run: |
          cd build/linux/x64/release/bundle
          tar czf "$GITHUB_WORKSPACE/songloft-linux-x64.tar.gz" .
      - name: Build DEB package
        continue-on-error: true
        run: |
          fastforge package --platform linux --targets deb
          DEB_FILE=$(find dist -maxdepth 2 -name "*.deb" -print -quit 2>/dev/null)
          if [ -n "$DEB_FILE" ]; then
            cp "$DEB_FILE" ./songloft-linux-x64.deb
          fi
      - name: Build RPM package
        continue-on-error: true
        run: |
          fastforge package --platform linux --targets rpm
          RPM_FILE=$(find dist -maxdepth 2 -name "*.rpm" -print -quit 2>/dev/null)
          if [ -n "$RPM_FILE" ]; then
            cp "$RPM_FILE" ./songloft-linux-x64.rpm
          fi
      - name: Build AppImage
        continue-on-error: true
        run: |
          fastforge package --platform linux --targets appimage
          APPIMAGE_FILE=$(find dist -maxdepth 2 -name "*.AppImage" -print -quit 2>/dev/null)
          if [ -n "$APPIMAGE_FILE" ]; then
            cp "$APPIMAGE_FILE" ./songloft-linux-x64.AppImage
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: songloft-linux-x64
          path: |
            songloft-linux-x64.tar.gz
            songloft-linux-x64.deb
            songloft-linux-x64.rpm
            songloft-linux-x64.AppImage

  build-windows:
    name: Windows (x64)
    runs-on: windows-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_windows }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install fastforge
        run: dart pub global activate fastforge
      - name: Add pub cache to PATH
        shell: pwsh
        run: echo "$env:LOCALAPPDATA\Pub\Cache\bin" >> $env:GITHUB_PATH
      - run: flutter pub get
      - name: Extract version from pubspec.yaml
        id: version
        shell: pwsh
        run: |
          $versionLine = (Select-String -Path pubspec.yaml -Pattern '^version:' | Select-Object -First 1).Line
          $pubspecVersion = ($versionLine -replace 'version:\s*', '') -replace '\+.*', ''
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $pubspecVersion
          } else {
            $version = 'dev'
          }
          $buildTime = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd_HH:mm:ss')
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "build_time=$buildTime" >> $env:GITHUB_OUTPUT
      - name: Setup NuGet
        uses: nuget/setup-nuget@v2
      - run: flutter build windows --release --dart-define=FRONTEND_VERSION=${{ steps.version.outputs.version }} --dart-define=FRONTEND_BUILD_TIME=${{ steps.version.outputs.build_time }} --dart-define=TRACELY_APP_ID=${{ secrets.TRACELY_APP_ID }} --dart-define=TRACELY_APP_SECRET=${{ secrets.TRACELY_APP_SECRET }} --dart-define=TRACELY_HOST=${{ secrets.TRACELY_HOST }}
      # 同 Linux：许可全文已在 data/flutter_assets/ 里，这里再往 Release 根放一份，
      # 让绿色包解开就能看到。.zip 无签名；MSIX 的签名由 fastforge 在**打包之后**
      # 对最终内容计算，所以提前往 payload 里加文件同样零风险。
      - name: Bundle GPL-3.0 license text into Windows payload
        shell: pwsh
        run: |
          Copy-Item LICENSES\GPL-3.0.txt build\windows\x64\runner\Release\LICENSE-GPL-3.0.txt
      - name: Package ZIP (绿色便携包)
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath songloft-windows-x64.zip
      - name: Build MSIX package
        continue-on-error: true
        shell: pwsh
        run: |
          fastforge package --platform windows --targets msix
          $msixFile = Get-ChildItem -Path "dist" -Recurse -Filter "*.msix" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msixFile) {
            Copy-Item $msixFile.FullName -Destination songloft-windows-x64.msix
          }
      - uses: actions/upload-artifact@v4
        with:
          name: songloft-windows-x64
          path: |
            songloft-windows-x64.zip
            songloft-windows-x64.msix

  build-macos:
    name: macOS (Universal)
    runs-on: macos-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_macos }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install fastforge and appdmg
        run: |
          dart pub global activate fastforge
          npm install -g appdmg
      - name: Add pub cache to PATH
        run: echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH
      - run: flutter pub get
      - name: Extract version from pubspec.yaml
        id: version
        run: |
          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="$PUBSPEC_VERSION"
          else
            VERSION="dev"
          fi
          BUILD_TIME=$(date -u '+%Y-%m-%d_%H:%M:%S')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_time=$BUILD_TIME" >> "$GITHUB_OUTPUT"
      - run: flutter build macos --release --dart-define=FRONTEND_VERSION=${{ steps.version.outputs.version }} --dart-define=FRONTEND_BUILD_TIME=${{ steps.version.outputs.build_time }} --dart-define=TRACELY_APP_ID=${{ secrets.TRACELY_APP_ID }} --dart-define=TRACELY_APP_SECRET=${{ secrets.TRACELY_APP_SECRET }} --dart-define=TRACELY_HOST=${{ secrets.TRACELY_HOST }}
      - name: Package ZIP (.app)
        run: |
          cd build/macos/Build/Products/Release
          zip -r -y "$GITHUB_WORKSPACE/songloft-macos.zip" *.app
      # 许可全文已在 .app 内（Contents/Frameworks/App.framework/Resources/
      # flutter_assets/LICENSES/），这里再往 zip **根**追加一份做可发现性。
      # 刻意只 append 到 zip 根、**不往 .app 包里塞** —— .app 的 codesign 签的是
      # bundle 内部内容，动它就得重签；zip 根的同级文件与签名完全无关。
      # DMG 不做同样处理：它由 fastforge 从 .app 生成，改它要动打包/签名流程，
      # 靠 .app 内的 asset 与 release 附件 LICENSE-GPL-3.0.txt 满足合规。
      - name: Attach GPL-3.0 license text at ZIP root (does not touch .app signature)
        run: |
          cp LICENSES/GPL-3.0.txt LICENSE-GPL-3.0.txt
          zip -j "$GITHUB_WORKSPACE/songloft-macos.zip" LICENSE-GPL-3.0.txt
          rm LICENSE-GPL-3.0.txt
      - name: Build DMG
        continue-on-error: true
        run: |
          fastforge package --platform macos --targets dmg
          DMG_FILE=$(find dist -maxdepth 2 -name "*.dmg" -print -quit 2>/dev/null)
          if [ -n "$DMG_FILE" ]; then
            cp "$DMG_FILE" ./songloft-macos.dmg
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: songloft-macos
          path: |
            songloft-macos.zip
            songloft-macos.dmg

  build-android:
    name: Android (APK)
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_android }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Extract version from pubspec.yaml
        id: version
        run: |
          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="$PUBSPEC_VERSION"
          else
            VERSION="dev"
          fi
          BUILD_TIME=$(date -u '+%Y-%m-%d_%H:%M:%S')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_time=$BUILD_TIME" >> "$GITHUB_OUTPUT"
      - name: Setup Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > $RUNNER_TEMP/release.jks
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV
          fi
      # 原生契约哈希:pub get 后、build 前计算并写 asset;同一 dart 值稍后写进 manifest。
      # 标准版无内嵌后端 → 不传 --export-surface,go 哈希留空。
      - name: Compute native contract hash (bake asset)
        run: |
          HASHES=$(./scripts/compute_native_contract.sh \
            --write-asset android/app/src/main/assets/native_contract.json)
          echo "native_contract.json = $HASHES"
          DART_CONTRACT_HASH=$(printf '%s' "$HASHES" | sed -n 's/.*"dart":"\([a-f0-9]*\)".*/\1/p')
          echo "DART_CONTRACT_HASH=$DART_CONTRACT_HASH" >> "$GITHUB_ENV"
      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          GIT_COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo unknown)
          echo "GIT_COMMIT=$GIT_COMMIT" >> "$GITHUB_ENV"
          flutter build apk --release --split-per-abi \
            --dart-define=FRONTEND_VERSION=${{ steps.version.outputs.version }} \
            --dart-define=FRONTEND_BUILD_TIME=${{ steps.version.outputs.build_time }} \
            --dart-define=FRONTEND_GIT_COMMIT=$GIT_COMMIT \
            --dart-define=FLUTTER_BINDING=${{ env.FLUTTER_VERSION }} \
            --dart-define=TRACELY_APP_ID=${{ secrets.TRACELY_APP_ID }} \
            --dart-define=TRACELY_APP_SECRET=${{ secrets.TRACELY_APP_SECRET }} \
            --dart-define=TRACELY_HOST=${{ secrets.TRACELY_HOST }}
      - name: Collect APKs
        run: |
          mkdir -p apk-output
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk apk-output/songloft-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk apk-output/songloft-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk apk-output/songloft-x86_64.apk
      # 无基线前端热更:每次发版自动产出本渠道最新的 libapp.so 补丁,随 release 上传;
      # 客户端查本渠道最新即更新(arm64-v8a/armeabi-v7a/x86_64)。标准版无内嵌后端,故只有前端补丁。
      - name: Produce frontend hot-update patch assets
        env:
          SEMVER: ${{ steps.version.outputs.version }}
          BUILD_TIME: ${{ steps.version.outputs.build_time }}
          FLUTTER_BINDING: ${{ env.FLUTTER_VERSION }}
        run: |
          set -e
          # 与 release_info 步骤保持一致：WebF 实验分支发到独立的 dev-webf release，
          # 这里若仍写 dev，manifest 里的 patchUrl 会指向不存在的路径。
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [[ "${GITHUB_REF#refs/heads/}" == feat/webf-plugin-render ]]; then
            TAG="dev-webf"
          else
            TAG="dev"
          fi
          # --split-per-abi 时 gradle 会把各 ABI APK 的 versionCode 改写为
          # 「ABI偏移×1000+pubspec基础值」(如 arm64-v8a=2001),flutter_patcher 按
          # versionCode 严格绑定,manifest/补丁必须写 APK 的**真实值**(用 aapt 读),
          # 写 pubspec 裸值会让客户端 versionCode 闸恒不通过。
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for abi in arm64-v8a armeabi-v7a x86_64; do
            apk="build/app/outputs/flutter-apk/app-${abi}-release.apk"
            [ -f "$apk" ] || { echo "跳过 $abi(无 APK)"; continue; }
            ABI_VC=$("$BUILD_TOOLS_DIR/aapt" dump badging "$apk" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)
            [ -n "$ABI_VC" ] || { echo "::error::无法从 $apk 读取 versionCode"; exit 1; }
            LABEL="${SEMVER}-${GIT_COMMIT}"
            rm -rf dist
            dart run flutter_patcher:pack --apk "$apk" --version "$LABEL" \
              --target-version-code "$ABI_VC" --abi "$abi"
            cp dist/patch.zip "apk-output/patch-${abi}.zip"
            ZIP_MD5=$(md5sum "apk-output/patch-${abi}.zip" | cut -d' ' -f1)
            cat > "apk-output/manifest-${abi}.json" <<EOF
          {
            "hasUpdate": true,
            "patch": {
              "version": "${LABEL}",
              "semanticVersion": "${SEMVER}",
              "gitCommit": "${GIT_COMMIT}",
              "flutterBinding": "${FLUTTER_BINDING}",
              "contractHash": "${DART_CONTRACT_HASH}",
              "targetVersionCode": ${ABI_VC},
              "patchUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/patch-${abi}.zip",
              "md5": "${ZIP_MD5}"
            }
          }
          EOF
            echo "前端补丁 $abi: zip_md5=$ZIP_MD5 label=$LABEL versionCode=$ABI_VC"
          done
      # version.json:设置页「检查客户端更新」dev 渠道靠它拿 git_commit / build_time
      # 做精确比较(frontend_version_api._fetchDevVersionInfo),缺失会导致 dev 客户端
      # 永远显示「已是最新」。格式对齐父仓库 release.yml 的 version.json。
      - name: Generate version.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_TIME: ${{ steps.version.outputs.build_time }}
        run: |
          cat > apk-output/version.json <<EOF
          {
            "version": "${VERSION}",
            "git_commit": "${GIT_COMMIT}",
            "build_time": "${BUILD_TIME}"
          }
          EOF
          cat apk-output/version.json
      - uses: actions/upload-artifact@v4
        with:
          name: songloft-android-apk
          path: |
            apk-output/*.apk
            apk-output/patch-*.zip
            apk-output/manifest-*.json
            apk-output/version.json

  build-ios:
    name: iOS (No Codesign)
    runs-on: macos-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_ios }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Extract version from pubspec.yaml
        id: version
        run: |
          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="$PUBSPEC_VERSION"
          else
            VERSION="dev"
          fi
          BUILD_TIME=$(date -u '+%Y-%m-%d_%H:%M:%S')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_time=$BUILD_TIME" >> "$GITHUB_OUTPUT"
      - run: flutter build ios --release --no-codesign --dart-define=FRONTEND_VERSION=${{ steps.version.outputs.version }} --dart-define=FRONTEND_BUILD_TIME=${{ steps.version.outputs.build_time }} --dart-define=TRACELY_APP_ID=${{ secrets.TRACELY_APP_ID }} --dart-define=TRACELY_APP_SECRET=${{ secrets.TRACELY_APP_SECRET }} --dart-define=TRACELY_HOST=${{ secrets.TRACELY_HOST }}
      - name: Package as IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -y songloft-ios-nosign.ipa Payload
          rm -rf Payload
      - uses: actions/upload-artifact@v4
        with:
          name: songloft-ios
          path: songloft-ios-nosign.ipa

  # ============================================================
  # 发布 Release
  # ============================================================
  release:
    name: Create Release
    if: ${{ always() }}
    needs:
      - build-web
      - build-linux
      - build-windows
      - build-macos
      - build-android
      - build-ios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史以生成 changelog

      - name: Determine release info
        id: release_info
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "name=Release $TAG" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
          else
            # 分支触发（push to main / workflow_dispatch）统一用 dev tag 滚动 prerelease
            BRANCH="${GITHUB_REF#refs/heads/}"
            # WebF 实验分支（songloft-org/songloft#341）刻意发到独立 tag：
            # 共享的 dev 预发布是 dev 渠道客户端热更新检查的目标，若把实验构建
            # 推到那里，所有 dev 用户都会被自动升到这个 beta 渲染引擎上。
            # 本分支合并回 main 前必须删掉这段。
            if [[ "$BRANCH" == feat/webf-plugin-render ]]; then
              echo "tag=dev-webf" >> "$GITHUB_OUTPUT"
            else
              echo "tag=dev" >> "$GITHUB_OUTPUT"
            fi
            echo "name=Dev Build ($BRANCH)" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Get previous tag
        id: prev-tag
        run: |
          CURRENT_TAG="${{ steps.release_info.outputs.tag }}"
          HEAD_SHA=$(git rev-parse HEAD)

          if [[ "$CURRENT_TAG" == "dev" ]]; then
            # dev 构建：排除指向 HEAD 同一 commit 的 tag，防止 fromTag==toTag 导致 changelog 为空报错
            PREV_TAG=""
            for tag in $(git --no-pager tag --sort=-creatordate --merged HEAD | grep '^v'); do
              TAG_SHA=$(git rev-list -n1 "$tag")
              if [[ "$TAG_SHA" != "$HEAD_SHA" ]]; then
                PREV_TAG="$tag"
                break
              fi
            done
          else
            # release 构建：按名称排除当前 tag
            PREV_TAG=$(git --no-pager tag --sort=creatordate --merged HEAD | grep '^v' | grep -v "^${CURRENT_TAG}$" | tail -1)
          fi

          if [ -z "$PREV_TAG" ]; then
            PREV_TAG=$(git rev-list --max-parents=0 HEAD)
            echo "No previous tag found, using first commit: ${PREV_TAG}"
          else
            echo "Previous tag: ${PREV_TAG}"
          fi

          echo "previous_tag=${PREV_TAG}" >> $GITHUB_OUTPUT

      - name: Generate Changelog from Conventional Commits
        id: changelog
        uses: requarks/changelog-action@v1
        with:
          token: ${{ github.token }}
          fromTag: ${{ startsWith(github.ref, 'refs/tags/') && steps.release_info.outputs.tag || github.sha }}
          toTag: ${{ steps.prev-tag.outputs.previous_tag }}
          writeToFile: false
          useGitmojis: true
          includeInvalidCommits: false
          restrictToTypes: feat,fix,docs,style,refactor,perf,test,build,ci,chore,revert

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
        continue-on-error: true

      - name: Flatten artifacts
        run: |
          mkdir -p final-assets
          if [ -d release-assets ]; then
            find release-assets -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.apk' -o -name '*.ipa' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.msix' -o -name 'manifest-*.json' -o -name 'version.json' \) -exec cp {} final-assets/ \;
          fi
          echo "=== Release Assets ==="
          ls -lh final-assets/ || echo "(no assets)"

      # GPLv3 合规（songloft-org/songloft#341）：原生平台构建链接 WebF（GPL-3.0-only，
      # 无链接例外），所以我们分发的每个原生二进制整体受 GPL-3.0 约束。GPLv3 要求
      # 随程序一并给出许可证全文（§4/§5）与完整对应源码的获取方式（§6）。
      # 这两个文件因此必须挂在**每一个** release 上，dev 预发布也算分发。
      - name: Attach GPL-3.0 license text + corresponding source notice
        run: |
          # 与父仓库 release.yml 的同名 step 对称：本次一个产物都没有（所有构建 job
          # 全失败）时不挂许可证文件。否则会发出一个「只有两份许可证文本、没有任何
          # 二进制」的 release，比空 release 更让人误以为有东西可下。
          if ! compgen -G "final-assets/*" > /dev/null 2>&1; then
            echo "本次 release 没有任何构建产物，跳过 GPL 附件"
            exit 0
          fi

          mkdir -p final-assets
          cp LICENSES/GPL-3.0.txt final-assets/LICENSE-GPL-3.0.txt

          TAG="${{ steps.release_info.outputs.tag }}"
          COMMIT="${GITHUB_SHA}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          # WebF 的版本有两个来源，语义完全不同，GPL §6 的对应源码声明里必须让接收者
          # 分得清他拿到的是哪一种：
          #   - pubspec.lock 的 `version:` 是本次构建**真正链接**的解析版本
          #   - pubspec.yaml 的 `webf: ^X.Y.Z` 只是版本**约束**（一个范围，不是版本）
          # pubspec.lock 被 .gitignore 忽略、不入库，而本 job 是独立的全新 checkout
          # 且不跑 flutter pub get，所以 CI 里它**必然不存在**。因此以入库的
          # pubspec.yaml 为主来源，lock 恰好存在时（本地跑、或将来 lock 入库）才升级
          # 成精确的解析版本。
          #
          # 铁律：`run:` 的默认 shell 是 `bash -e`，`VAR=$(失败命令)` 会让赋值语句
          # 本身以非零退出 → 整步立刻中止，紧跟其后的兜底行**永远执行不到**。
          # songloft-org/songloft#341 的 player release run 就是这么炸的：awk 读不到
          # pubspec.lock → fatal → 8 个构建 job 全绿但 Create Release 整个失败。
          # 所以下面每个命令替换都带 `|| true`，文件存在性一律先用 `[ -f ]` 守卫。
          WEBF_RESOLVED=""
          if [ -f pubspec.lock ]; then
            WEBF_RESOLVED=$(awk '/^  webf:/{f=1} f&&/^    version:/{gsub(/"/,"",$2); print $2; exit}' pubspec.lock || true)
          fi
          WEBF_CONSTRAINT=""
          if [ -f pubspec.yaml ]; then
            WEBF_CONSTRAINT=$(awk '$1=="webf:"{print $2; exit}' pubspec.yaml || true)
          fi

          if [ -n "$WEBF_RESOLVED" ]; then
            WEBF_VERSION_LINE="version     : ${WEBF_RESOLVED}"
            WEBF_VERSION_NOTE="(the exact version linked into this build, as resolved in pubspec.lock)"
          elif [ -n "$WEBF_CONSTRAINT" ]; then
            WEBF_VERSION_LINE="constraint  : ${WEBF_CONSTRAINT}"
            WEBF_VERSION_NOTE="(this is the version CONSTRAINT declared in pubspec.yaml, NOT the
              resolved version -- pubspec.lock is not committed to this
              repository. The exact version linked into this build is in the
              \"flutter pub get\" output of the build log linked below.)"
          else
            WEBF_VERSION_LINE="version     : see the \"flutter pub get\" output of the build log"
            WEBF_VERSION_NOTE="(neither pubspec.lock nor pubspec.yaml could be read in the release
              job; the build log linked below is authoritative.)"
          fi

          cat > final-assets/CORRESPONDING-SOURCE.txt <<EOF
          Songloft client -- COMPLETE CORRESPONDING SOURCE
          =================================================

          The native platform builds in this release (Android .apk, iOS .ipa,
          Windows .zip/.msix, macOS .zip/.dmg, Linux .tar.gz/.deb/.rpm/.AppImage)
          link against WebF, which is licensed GPL-3.0-only with no linking
          exception. Each of those binaries is therefore governed AS A WHOLE by
          the GNU General Public License, version 3 -- a verbatim copy of which
          is attached to this release as LICENSE-GPL-3.0.txt.

          You are entitled to the complete corresponding source code of that
          combined work. This is exactly what it was built from:

            Client (this repository)
              https://github.com/${GITHUB_REPOSITORY}
              release tag : ${TAG}
              commit      : ${COMMIT}
              (git clone https://github.com/${GITHUB_REPOSITORY}.git && git checkout ${COMMIT})

            WebF (rendering engine, GPL-3.0-only)
              https://github.com/openwebf/webf
              ${WEBF_VERSION_LINE}
              ${WEBF_VERSION_NOTE}
              build log   : ${RUN_URL}

            Songloft server (Apache-2.0, separate program)
              https://github.com/songloft-org/songloft

          Build instructions live in docs/build_guide.md in the client
          repository; the exact toolchain versions and build commands used for
          this release are in .github/workflows/build-and-release.yml at the
          commit above, and the full build logs are retained on the workflow
          run for this release.

          The Web bundle (songloft-web-*.tar.gz) does NOT contain WebF -- WebF
          does not support Flutter Web -- and remains under Apache-2.0 alone,
          as does the client source code itself (see LICENSE and NOTICE).

          Third-party component list and license notices: NOTICE.
          EOF

          echo "=== GPL compliance assets ==="
          ls -l final-assets/LICENSE-GPL-3.0.txt final-assets/CORRESPONDING-SOURCE.txt
          cat final-assets/CORRESPONDING-SOURCE.txt

      - name: Delete existing release (for branch builds)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${{ steps.release_info.outputs.tag }}" --yes --cleanup-tag 2>/dev/null || true

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGELOG_BODY: ${{ steps.changelog.outputs.changes }}
        run: |
          TAG="${{ steps.release_info.outputs.tag }}"
          TITLE="${{ steps.release_info.outputs.name }}"
          IS_PRERELEASE="${{ steps.release_info.outputs.prerelease }}"
          MAKE_LATEST="${{ steps.release_info.outputs.make_latest }}"

          # 通过环境变量获取 changelog，避免反引号等特殊字符被 shell 解释
          RELEASE_NOTES="${CHANGELOG_BODY}"

          # 如果 changelog 为空，使用默认内容
          if [ -z "$RELEASE_NOTES" ] || [ "$RELEASE_NOTES" = "" ]; then
            if [[ "${IS_PRERELEASE}" == "true" ]]; then
              RELEASE_NOTES="Development build from branch: ${{ github.ref_name }}"
            else
              RELEASE_NOTES="Release ${TAG}"
            fi
          fi

          ARGS=(
            "${TAG}"
            --title "${TITLE}"
            --notes "${RELEASE_NOTES}"
          )

          if [[ "${IS_PRERELEASE}" == "true" ]]; then
            ARGS+=(--prerelease)
          fi

          if [[ "${MAKE_LATEST}" == "true" ]]; then
            ARGS+=(--latest)
          fi

          # 对于 tag 触发，直接使用已有 tag；对于分支触发，需要指定 target
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            ARGS+=(--target "${{ github.sha }}")
          fi

          # 有产物则附加上传，否则仅创建 Release
          if compgen -G "final-assets/*" > /dev/null 2>&1; then
            gh release create "${ARGS[@]}" final-assets/*
          else
            gh release create "${ARGS[@]}"
          fi
