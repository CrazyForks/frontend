<!DOCTYPE html>
<!--
  WebF 图标连字生死闸探针（songloft-org/songloft#341）

  这个页面刻意加载**真实的** common.css 与真实字体文件（由 entrypoint.sh 组合的
  docroot 提供），不复刻简化版 —— 否则测不到真实条件。

  怎么读截图（每一行都是自解释的判据）：
    1. CONTROL      纯文本，证明页面真的加载并渲染了。这行都没有 → 别看后面几行
    2. LIGATURE     插件里 ~350 处的真实写法。出现图标字形 = 闸通过；
                    出现英文单词 "download settings play_arrow" = 闸失败
                    （Material Symbols 刻意保留了拉丁字母轮廓做降级，所以
                     连字失效时会显示可读单词而不是豆腐块）
    3. CODEPOINT    闸失败时的补救路径能否走通。码点由 entrypoint.sh 用
                    fontTools 从真实 woff2 的 cmap 里查出来后注入，不靠猜
    4. FLEX GAP     覆盖面最广的单一 CSS 特性（common.css 7 处 + 插件 348 处）。
                    三个方块之间有间距 = 支持
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>WebF probe</title>
  <link rel="stylesheet" href="./common.css">
  <style>
    body { margin: 0; padding: 16px; background: #fff; color: #000;
           font-family: Roboto, sans-serif; }
    .row { display: flex; align-items: center; margin-bottom: 20px; }
    .tag { width: 190px; font-size: 13px; font-weight: 700; color: #666; }
    .gapbox { display: flex; gap: 24px; }
    .gapbox i { width: 40px; height: 40px; background: #3f51b5; display: block; }
  </style>
</head>
<body>
  <div class="row">
    <span class="tag">1 CONTROL</span>
    <span style="font-size:20px">plain text renders</span>
  </div>

  <div class="row">
    <span class="tag">2 LIGATURE</span>
    <span class="material-symbols-outlined" style="font-size:40px">download</span>
    <span class="material-symbols-outlined" style="font-size:40px">settings</span>
    <span class="material-symbols-outlined" style="font-size:40px">play_arrow</span>
  </div>

  <div class="row">
    <span class="tag">3 CODEPOINT</span>
    <span class="material-symbols-outlined" style="font-size:40px">__CODEPOINT_DOWNLOAD__</span>
    <span class="material-symbols-outlined" style="font-size:40px">__CODEPOINT_SETTINGS__</span>
    <span class="material-symbols-outlined" style="font-size:40px">__CODEPOINT_PLAY_ARROW__</span>
  </div>

  <div class="row">
    <span class="tag">4 FLEX GAP</span>
    <span class="gapbox"><i></i><i></i><i></i></span>
  </div>

  <!--
    5/6 分离「主题不生效」的两个可能原因（songloft-org/songloft#341）。
    common.js 用 documentElement.dataset.theme 写属性，common.css 用
    html[data-theme="dark"] 选择 —— 任一环断掉主题都不生效，而现象一样。
      5 显示 getAttribute('data-theme') 的真实值：null = dataset setter 没写进属性
      6 方块变绿 = 属性选择器匹配成功；仍是红 = 选择器没匹配
  -->
  <div class="row">
    <span class="tag">5 DATASET ATTR</span>
    <span id="attrval" style="font-size:20px">(script did not run)</span>
  </div>

  <div class="row">
    <span class="tag">6 ATTR SELECTOR</span>
    <span id="selbox"></span>
  </div>

  <!--
    7 common.js 靠 window.location.search 读 ?theme= 与 ?embed=。若 WebF 不把
    query 暴露到 location，主题与嵌入模式会**同时**静默失效，而现象只是「页面
    看起来是亮色」，极易误判成 CSS 问题。用 run.sh 传带 query 的 PROBE_URL 观察。
  -->
  <div class="row">
    <span class="tag">7 LOCATION QUERY</span>
    <span id="loc" style="font-size:18px">(script did not run)</span>
  </div>

  <!--
    8 common.css 的暗色主题不是靠直接属性，而是在 html[data-theme="dark"] 里
    **重定义 CSS 变量**（约 40 个 --md-*），元素侧用 var() 引用。所以第 6 行通过
    不代表主题能用 —— 必须单独验「更具体的选择器重定义变量后，var() 是否重解析」。
    绿 = 变量覆盖生效；红 = 只认 :root 的初值，暗色主题整体失效。
  -->
  <div class="row">
    <span class="tag">8 VAR OVERRIDE</span>
    <span id="varbox"></span>
  </div>

  <style>
    #selbox { width: 40px; height: 40px; display: block; background: #c62828; }
    html[data-theme="dark"] #selbox { background: #2e7d32; }

    :root { --probe-c: #c62828; }
    html[data-theme="dark"] { --probe-c: #2e7d32; }
    #varbox {
      width: 40px; height: 40px; display: block;
      background: var(--probe-c);
    }
  </style>
  <script>
    document.documentElement.dataset.theme = 'dark';
    document.getElementById('attrval').textContent =
      JSON.stringify(document.documentElement.getAttribute('data-theme'));

    var sp = new URLSearchParams(window.location.search);
    document.getElementById('loc').textContent =
      'search=' + JSON.stringify(window.location.search) +
      '  theme=' + JSON.stringify(sp.get('theme')) +
      '  hasEmbed=' + sp.has('embed');
  </script>
</body>
</html>
